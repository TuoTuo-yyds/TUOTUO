<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>串口控制 - 弹幕关键词检测系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .danmaku-area {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
            transition: background-color 0.5s ease;
        }

        .danmaku-container {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .danmaku {
            position: absolute;
            white-space: nowrap;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            animation: moveDanmaku linear forwards;
            z-index: 10;
        }

        @keyframes moveDanmaku {
            from {
                transform: translateX(100vw);
            }
            to {
                transform: translateX(-100%);
            }
        }

        .control-panel {
            width: 320px;
            background: #2d2d2d;
            padding: 20px;
            overflow-y: auto;
            border-left: 1px solid #444;
            position: relative;
            z-index: 100;
        }

        .section {
            margin-bottom: 25px;
        }

        .section h3 {
            color: #ff6b6b;
            margin-bottom: 12px;
            font-size: 16px;
            padding-bottom: 5px;
            border-bottom: 2px solid #444;
        }

        .section label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #ccc;
        }

        .section input[type="text"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #444;
            border-radius: 4px;
            background: #1a1a1a;
            color: #fff;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .btn {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.3s;
            margin-right: 8px;
            margin-bottom: 8px;
        }

        .btn:hover {
            background: linear-gradient(135deg, #ee5a5a, #dd4a4a);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #4ecdc4, #3dbdb4);
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #3dbdb4, #2dad9a);
        }

        .btn:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4757;
            margin-right: 8px;
        }

        .status.connected {
            background: #2ed573;
        }

        .keyword-hint {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
            padding: 8px;
            background: #1a1a1a;
            border-radius: 4px;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
        }

        .tag.positive {
            background: rgba(78, 205, 196, 0.2);
            color: #4ecdc4;
        }

        .tag.negative {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        .terminal-panel {
            display: none;
        }

        .danmaku.positive {
            color: #4ecdc4;
        }

        .danmaku.negative {
            color: #ff6b6b;
        }

        .danmaku.neutral {
            color: #fff;
        }

        .stats-container {
            display: flex;
            justify-content: space-between;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .stat-value {
            display: block;
            font-size: 28px;
            font-weight: bold;
            color: #fff;
        }

        .stat-item.positive .stat-value {
            color: #4ecdc4;
        }

        .stat-item.negative .stat-value {
            color: #ff6b6b;
        }

        .stat-item .stat-label {
            font-size: 12px;
            color: #888;
        }

        .word-cloud-container {
            width: 100%;
            height: 200px;
            background: #1a1a1a;
            border-radius: 4px;
            border: 1px solid #444;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .word-cloud-container:hover {
            border-color: #ff6b6b;
        }

        .word-cloud-container::after {
            content: '点击放大';
            position: absolute;
            bottom: 5px;
            right: 10px;
            font-size: 11px;
            color: #666;
        }

        .word-cloud-item {
            position: absolute;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            white-space: nowrap;
            font-weight: bold;
        }

        .word-cloud-item:hover {
            transform: scale(1.2);
            opacity: 0.8;
        }

        .word-cloud-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .word-cloud-modal.show {
            display: flex;
        }

        .word-cloud-modal-header {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .modal-close-btn {
            background: rgba(255, 107, 107, 0.8);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .modal-close-btn:hover {
            background: rgba(255, 107, 107, 1);
        }

        .word-cloud-modal-container {
            width: 90%;
            height: 80%;
            background: #1a1a1a;
            border-radius: 10px;
            border: 1px solid #444;
            overflow: hidden;
            position: relative;
        }

        .word-cloud-modal-item {
            position: absolute;
            cursor: pointer;
            transition: transform 0.3s, opacity 0.3s;
            white-space: nowrap;
            font-weight: bold;
        }

        .word-cloud-modal-item:hover {
            transform: scale(1.3);
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="danmaku-area" id="danmakuArea" style="background: linear-gradient(135deg, rgb(78, 205, 196) 0%, rgb(68, 129, 235) 30%, rgb(102, 126, 234) 70%, rgb(118, 75, 162) 100%);">
        <div class="danmaku-container" id="danmakuContainer"></div>
    </div>

    <div class="control-panel">
        <div class="section">
            <h3>串口连接</h3>
            <button class="btn" onclick="connectSerial()" id="connectBtn" disabled="">连接串口</button>
            <button class="btn btn-secondary" onclick="disconnectSerial()" id="disconnectBtn">断开连接</button>
            <div style="margin-top: 10px;">
                <span class="status connected" id="statusIndicator"></span>
                <span id="statusText">已连接</span>
            </div>
        </div>

        <div class="section">
            <h3>弹幕输入</h3>
            <input type="text" id="keywordInput" placeholder="输入弹幕内容..." onkeydown="if(event.keyCode==13) sendKeyword()">
            <button class="btn" onclick="sendKeyword()" id="sendBtn">发送弹幕</button>
            <div class="keyword-hint">
                <strong>正面关键词：</strong>宝贝、喜欢、爱你、好棒、开心...<br>
                <strong>负面关键词：</strong>讨厌、烦死了、恶心、烦躁...
            </div>
        </div>

        <div class="section">
            <h3>快捷命令</h3>
            <button class="btn btn-secondary" onclick="sendCommand(&#39;1&#39;)" id="btnPositive">正面效果 (1)</button>
            <button class="btn btn-secondary" onclick="sendCommand(&#39;2&#39;)" id="btnNegative">负面效果 (2)</button>
            <button class="btn btn-secondary" onclick="sendCommand(&#39;STATUS&#39;)" id="btnStatus">查询状态</button>
        </div>

        <div class="section">
            <h3>正面关键词</h3>
            <div class="tag-list" id="positiveTags"><span class="tag positive">宝贝</span><span class="tag positive">我爱你</span><span class="tag positive">喜欢你</span><span class="tag positive">好棒</span><span class="tag positive">开心</span><span class="tag positive">爱你</span><span class="tag positive">想你</span><span class="tag positive">可爱</span><span class="tag positive">真棒</span><span class="tag positive">喜欢</span><span class="tag positive">爱</span><span class="tag positive">漂亮</span><span class="tag positive">优秀</span><span class="tag positive">厉害</span><span class="tag positive">太棒了</span><span class="tag positive">真好</span><span class="tag positive">太好了</span><span class="tag positive">太棒</span><span class="tag positive">美丽</span><span class="tag positive">帅气</span><span class="tag positive">赞</span><span class="tag positive">给力</span><span class="tag positive">完美</span><span class="tag positive">精彩</span><span class="tag positive">快乐</span><span class="tag positive">幸福</span><span class="tag positive">甜蜜</span><span class="tag positive">温馨</span><span class="tag positive">浪漫</span><span class="tag positive">感动</span><span class="tag positive">惊喜</span><span class="tag positive">高兴</span><span class="tag positive">美好</span></div>
        </div>

        <div class="section">
            <h3>负面关键词</h3>
            <div class="tag-list" id="negativeTags"><span class="tag negative">讨厌</span><span class="tag negative">烦死了</span><span class="tag negative">恶心</span><span class="tag negative">讨厌死了</span><span class="tag negative">烦躁</span><span class="tag negative">烦</span><span class="tag negative">无聊</span><span class="tag negative">烦死人</span><span class="tag negative">可恶</span><span class="tag negative">烦人</span><span class="tag negative">讨厌死</span><span class="tag negative">恶心死</span><span class="tag negative">烦躁死</span><span class="tag negative">烦死</span><span class="tag negative">无聊死</span><span class="tag negative">难受</span><span class="tag negative">痛苦</span><span class="tag negative">伤心</span><span class="tag negative">难过</span><span class="tag negative">悲伤</span><span class="tag negative">郁闷</span><span class="tag negative">生气</span><span class="tag negative">愤怒</span><span class="tag negative">恼火</span><span class="tag negative">暴躁</span><span class="tag negative">反感</span><span class="tag negative">厌恶</span><span class="tag negative">嫌弃</span></div>
        </div>

        <div class="section">
            <h3>弹幕统计</h3>
            <div class="stats-container">
                <div class="stat-item">
                    <span class="stat-value" id="totalCount">6</span>
                    <span class="stat-label">总弹幕数</span>
                </div>
                <div class="stat-item positive">
                    <span class="stat-value" id="positiveCount">1</span>
                    <span class="stat-label">正面关键词</span>
                </div>
                <div class="stat-item negative">
                    <span class="stat-value" id="negativeCount">4</span>
                    <span class="stat-label">负面关键词</span>
                </div>
            </div>
        </div>

        <div class="section">
            <h3>词云</h3>
            <div class="word-cloud-container" id="wordCloudContainer" onclick="openWordCloudModal()"><div class="word-cloud-item" title="喜欢: 1次" style="color: rgb(255, 107, 107); font-size: 14px; left: 78.6323%; top: 32.3587%; transform: rotate(4.04307deg);">喜欢</div><div class="word-cloud-item" title="讨厌: 2次" style="color: rgb(78, 205, 196); font-size: 38px; left: 16.9725%; top: 44.2485%; transform: rotate(-2.14315deg);">讨厌</div><div class="word-cloud-item" title="恶心: 2次" style="color: rgb(255, 217, 61); font-size: 38px; left: 39.2342%; top: 34.8724%; transform: rotate(1.17703deg);">恶心</div></div>
        </div>
    </div>

    <div class="word-cloud-modal" id="wordCloudModal">
        <div class="word-cloud-modal-header">
            <button class="modal-close-btn" onclick="closeWordCloudModal()">关闭</button>
        </div>
        <div class="word-cloud-modal-container" id="wordCloudModalContainer"><div class="word-cloud-modal-item" title="喜欢: 1次" style="color: rgb(255, 107, 107); font-size: 20px; left: 11.558%; top: 14.4627%; transform: rotate(3.80855deg);">喜欢</div><div class="word-cloud-modal-item" title="讨厌: 2次" style="color: rgb(78, 205, 196); font-size: 60px; left: 21.7957%; top: 80.2119%; transform: rotate(1.29871deg);">讨厌</div><div class="word-cloud-modal-item" title="恶心: 1次" style="color: rgb(255, 217, 61); font-size: 20px; left: 27.288%; top: 41.3007%; transform: rotate(4.24616deg);">恶心</div></div>
    </div>

    <script>
        let port;
        let reader;
        let writer;

        const positiveWords = ['宝贝', '我爱你', '喜欢你', '好棒', '开心', '爱你', '想你', '可爱', '真棒', '喜欢', '爱', '漂亮', '优秀', '厉害', '太棒了', '真好', '太好了', '太棒', '美丽', '帅气', '赞', '给力', '完美', '精彩', '快乐', '幸福', '甜蜜', '温馨', '浪漫', '感动', '惊喜', '高兴', '美好'];
        const negativeWords = ['讨厌', '烦死了', '恶心', '讨厌死了', '烦躁', '烦', '无聊', '烦死人', '可恶', '烦人', '讨厌死', '恶心死', '烦躁死', '烦死', '无聊死', '难受', '痛苦', '伤心', '难过', '悲伤', '郁闷', '生气', '愤怒', '恼火', '暴躁', '反感', '厌恶', '嫌弃'];

        const danmakuColors = ['#ff6b6b', '#4ecdc4', '#ffd93d', '#a29bfe', '#fd79a8', '#00b894', '#e17055', '#6c5ce7'];
        const wordCloudColors = ['#ff6b6b', '#4ecdc4', '#ffd93d', '#a29bfe', '#fd79a8', '#00b894', '#e17055', '#6c5ce7', '#ffeaa7', '#81ecec', '#fab1a0', '#fd79a8'];

        let totalCount = 0;
        let positiveCount = 0;
        let negativeCount = 0;
        let wordCount = {};

        function updateStats(type) {
            totalCount++;
            if (type === 'positive') positiveCount++;
            else if (type === 'negative') negativeCount++;
            
            document.getElementById('totalCount').textContent = totalCount;
            document.getElementById('positiveCount').textContent = positiveCount;
            document.getElementById('negativeCount').textContent = negativeCount;
        }

        function updateWordCloud(text) {
            const matchedWords = [];
            positiveWords.forEach(word => {
                if (text.includes(word)) {
                    matchedWords.push(word);
                }
            });
            negativeWords.forEach(word => {
                if (text.includes(word)) {
                    matchedWords.push(word);
                }
            });

            matchedWords.forEach(word => {
                if (!wordCount[word]) {
                    wordCount[word] = 0;
                }
                wordCount[word]++;
            });

            renderWordCloud();
        }

        function renderWordCloud() {
            const container = document.getElementById('wordCloudContainer');
            container.innerHTML = '';

            const words = Object.keys(wordCount);
            if (words.length === 0) {
                container.innerHTML = '<div style="text-align: center; line-height: 200px; color: #666;">暂无数据</div>';
                return;
            }

            const maxCount = Math.max(...Object.values(wordCount));
            const minCount = Math.min(...Object.values(wordCount));

            words.forEach((word, index) => {
                const count = wordCount[word];
                const fontSize = 14 + (count - minCount) / (maxCount - minCount || 1) * 24;
                const color = wordCloudColors[index % wordCloudColors.length];
                
                const item = document.createElement('div');
                item.className = 'word-cloud-item';
                item.textContent = word;
                item.style.color = color;
                item.style.fontSize = `${fontSize}px`;
                item.style.left = `${Math.random() * 70 + 10}%`;
                item.style.top = `${Math.random() * 70 + 10}%`;
                item.style.transform = `rotate(${(Math.random() - 0.5) * 20}deg)`;
                item.title = `${word}: ${count}次`;

                container.appendChild(item);
            });
        }

        function openWordCloudModal() {
            const modal = document.getElementById('wordCloudModal');
            modal.classList.add('show');
            renderModalWordCloud();
        }

        function closeWordCloudModal() {
            const modal = document.getElementById('wordCloudModal');
            modal.classList.remove('show');
        }

        function renderModalWordCloud() {
            const container = document.getElementById('wordCloudModalContainer');
            container.innerHTML = '';

            const words = Object.keys(wordCount);
            if (words.length === 0) {
                container.innerHTML = '<div style="text-align: center; line-height: 400px; color: #666;">暂无数据</div>';
                return;
            }

            const maxCount = Math.max(...Object.values(wordCount));
            const minCount = Math.min(...Object.values(wordCount));

            words.forEach((word, index) => {
                const count = wordCount[word];
                const fontSize = 20 + (count - minCount) / (maxCount - minCount || 1) * 40;
                const color = wordCloudColors[index % wordCloudColors.length];
                
                const item = document.createElement('div');
                item.className = 'word-cloud-modal-item';
                item.textContent = word;
                item.style.color = color;
                item.style.fontSize = `${fontSize}px`;
                item.style.left = `${Math.random() * 75 + 10}%`;
                item.style.top = `${Math.random() * 75 + 10}%`;
                item.style.transform = `rotate(${(Math.random() - 0.5) * 15}deg)`;
                item.title = `${word}: ${count}次`;

                container.appendChild(item);
            });
        }

        function initTags() {
            const positiveContainer = document.getElementById('positiveTags');
            const negativeContainer = document.getElementById('negativeTags');
            
            positiveWords.forEach(word => {
                const tag = document.createElement('span');
                tag.className = 'tag positive';
                tag.textContent = word;
                positiveContainer.appendChild(tag);
            });
            
            negativeWords.forEach(word => {
                const tag = document.createElement('span');
                tag.className = 'tag negative';
                tag.textContent = word;
                negativeContainer.appendChild(tag);
            });
        }

        function detectKeyword(text) {
            for (let word of positiveWords) {
                if (text.includes(word)) return { type: 'positive', word: word };
            }
            for (let word of negativeWords) {
                if (text.includes(word)) return { type: 'negative', word: word };
            }
            return null;
        }

        function addDanmaku(text, type = 'neutral') {
            const container = document.getElementById('danmakuContainer');
            const danmaku = document.createElement('div');
            danmaku.className = 'danmaku ' + type;
            danmaku.textContent = text;
            
            const top = Math.random() * (window.innerHeight - 50);
            const duration = 8 + Math.random() * 4;
            const color = danmakuColors[Math.floor(Math.random() * danmakuColors.length)];
            
            if (type === 'neutral') {
                danmaku.style.color = color;
            }
            
            danmaku.style.top = top + 'px';
            danmaku.style.animationDuration = duration + 's';
            
            container.appendChild(danmaku);
            
            setTimeout(() => {
                danmaku.remove();
            }, duration * 1000);
        }

        function changeBackgroundColor(type) {
            const area = document.getElementById('danmakuArea');
            if (type === 'positive') {
                area.style.background = 'linear-gradient(135deg, #ff6b6b 0%, #ffa502 30%, #ff7f50 70%, #ff6348 100%)';
            } else if (type === 'negative') {
                area.style.background = 'linear-gradient(135deg, #4ecdc4 0%, #4481eb 30%, #667eea 70%, #764ba2 100%)';
            } else {
                area.style.background = '#000';
            }
        }

        async function connectSerial() {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });

                const textDecoder = new TextDecoderStream();
                const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
                reader = textDecoder.readable.getReader();

                const textEncoder = new TextEncoderStream();
                const writableStreamClosed = textEncoder.readable.pipeTo(port.writable);
                writer = textEncoder.writable.getWriter();

                updateStatus(true);
                addDanmaku('串口连接成功！', 'positive');
            } catch (error) {
                console.error('连接失败:', error);
                addDanmaku('连接失败: ' + error.message, 'negative');
            }
        }

        async function disconnectSerial() {
            if (reader) {
                await reader.cancel();
                reader = null;
            }
            if (writer) {
                await writer.close();
                writer = null;
            }
            if (port) {
                await port.close();
                port = null;
            }
            updateStatus(false);
            addDanmaku('串口已断开', 'neutral');
            changeBackgroundColor('neutral');
        }

        async function readLoop() {
            while (port && port.readable) {
                try {
                    const { value, done } = await reader.read();
                    if (done) break;
                    if (value.includes('positive') || value.includes('Positive')) {
                        changeBackgroundColor('positive');
                    } else if (value.includes('negative') || value.includes('Negative')) {
                        changeBackgroundColor('negative');
                    }
                } catch (error) {
                    console.error('读取错误:', error);
                    break;
                }
            }
        }

        async function sendKeyword() {
            const input = document.getElementById('keywordInput');
            const text = input.value.trim();
            if (!text || !writer) return;

            const detected = detectKeyword(text);
            let sendData = text;
            let danmakuType = 'neutral';

            if (detected) {
                if (detected.type === 'positive') {
                    sendData = '1';
                    danmakuType = 'positive';
                } else {
                    sendData = '2';
                    danmakuType = 'negative';
                }
            }

            try {
                await writer.write(sendData + '\n');
                addDanmaku(text, danmakuType);
                changeBackgroundColor(danmakuType);
                updateStats(danmakuType);
                updateWordCloud(text);
                input.value = '';
            } catch (error) {
                console.error('发送失败:', error);
            }
        }

        async function sendCommand(cmd) {
            if (!writer) return;
            try {
                await writer.write(cmd + '\n');
                if (cmd === '1') {
                    addDanmaku('触发正面效果', 'positive');
                    changeBackgroundColor('positive');
                } else if (cmd === '2') {
                    addDanmaku('触发负面效果', 'negative');
                    changeBackgroundColor('negative');
                }
            } catch (error) {
                console.error('发送失败:', error);
            }
        }

        function updateStatus(connected) {
            const statusIndicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            const sendBtn = document.getElementById('sendBtn');
            const btnPositive = document.getElementById('btnPositive');
            const btnNegative = document.getElementById('btnNegative');
            const btnStatus = document.getElementById('btnStatus');

            if (connected) {
                statusIndicator.classList.add('connected');
                statusText.textContent = '已连接';
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                sendBtn.disabled = false;
                btnPositive.disabled = false;
                btnNegative.disabled = false;
                btnStatus.disabled = false;
                readLoop();
            } else {
                statusIndicator.classList.remove('connected');
                statusText.textContent = '未连接';
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
                sendBtn.disabled = true;
                btnPositive.disabled = true;
                btnNegative.disabled = true;
                btnStatus.disabled = true;
            }
        }

        initTags();
    </script>

</body></html>
